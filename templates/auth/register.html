{% extends "base.html" %}

{% block title %}Student Registration | CampusPulse{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 1.5rem auto;">
    <div class="notebook-form" style="position: relative;">

        <div style="text-align: center; margin-bottom: 1.8rem;">
            <span style="font-size: 2.2rem; display: inline-block; margin-bottom: 0.3rem;">🎓</span>
            <h1 style="font-size: 1.65rem; font-weight: 800; color: var(--ink-black);">Student Registration</h1>
            <p class="hand-note" style="font-size: 1.25rem; color: var(--ink-pencil);">Enroll to claim digital passes, event certificates & workshop access</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.2rem;">
                
                <div class="form-group">
                    <label class="form-label">Full Name <span style="color: red;">*</span></label>
                    <input type="text" name="name" class="form-input" placeholder="e.g. Rahul Sharma" required>
                </div>

                <div class="form-group">
                    <label class="form-label">College Email <span style="color: red;">*</span></label>
                    <input type="email" name="email" class="form-input" placeholder="e.g. rahul@student.edu" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Roll Number / Student ID <span style="color: red;">*</span></label>
                    <input type="text" name="roll_number" class="form-input" placeholder="e.g. 23CS105" required style="font-family: var(--font-mono); text-transform: uppercase;">
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number <span style="color: red;">*</span></label>
                    <input type="tel" name="phone" class="form-input" placeholder="e.g. 9876543210" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Department <span style="color: red;">*</span></label>
                    <select name="department" class="form-select" required>
                        <option value="" disabled selected>Select Department</option>
                        <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Artificial Intelligence & DS">Artificial Intelligence & DS</option>
                        <option value="Electronics & Communication">Electronics & Communication</option>
                        <option value="Electrical & Electronics">Electrical & Electronics</option>
                        <option value="Mechanical Engineering">Mechanical Engineering</option>
                        <option value="Civil Engineering">Civil Engineering</option>
                        <option value="Management Studies (MBA)">Management Studies (MBA)</option>
                        <option value="Biotechnology">Biotechnology</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Year of Study <span style="color: red;">*</span></label>
                    <select name="year_of_study" class="form-select" required>
                        <option value="" disabled selected>Select Year</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                        <option value="PG / Masters">PG / Masters</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Password <span style="color: red;">*</span></label>
                    <input type="password" name="password" class="form-input" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password <span style="color: red;">*</span></label>
                    <input type="password" name="confirm_password" class="form-input" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="tactile-btn tactile-btn-primary" style="width: 100%; padding: 0.85rem 1rem; font-size: 1rem; margin-top: 1rem;">
                Complete Registration ➔
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.4rem; font-size: 0.88rem; color: var(--ink-pencil);">
            Already registered? <a href="{{ url_for('login') }}" style="color: var(--ink-pen-blue); font-weight: 700; text-decoration: underline;">Sign In here</a>
        </div>
    </div>
</div>
{% endblock %}
